[package]
name = "html-screenshot"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25"
futures = "0.3"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
chromiumoxide = { version = "0.7", features = ["tokio-runtime"] }
